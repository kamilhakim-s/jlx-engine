# Central version catalog — every module references libraries from here.
# This is the single source of truth for dependency versions across the build.
[versions]
jmh = "1.37"
hdrhistogram = "2.2.2"
junit = "5.11.3"
assertj = "3.26.3"
agrona = "1.22.0"
fastutil = "8.5.15"
disruptor = "4.0.0"
jackson = "2.18.2"
chronicle-queue = "2026.4"
flink = "2.2.0"
flink-connector-kafka = "5.0.0-2.2"
kafka = "4.2.0"
affinity = "3.23.3"
jna = "5.14.0"
aeron = "1.46.7"

[libraries]
hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }
agrona = { module = "org.agrona:agrona", version.ref = "agrona" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
disruptor = { module = "com.lmax:disruptor", version.ref = "disruptor" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
chronicle-queue = { module = "net.openhft:chronicle-queue", version.ref = "chronicle-queue" }
flink-streaming = { module = "org.apache.flink:flink-streaming-java", version.ref = "flink" }
flink-clients = { module = "org.apache.flink:flink-clients", version.ref = "flink" }
flink-connector-kafka = { module = "org.apache.flink:flink-connector-kafka", version.ref = "flink-connector-kafka" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
affinity = { module = "net.openhft:affinity", version.ref = "affinity" }
# affinity transitively pins JNA 5.5.0, which ships NO arm64 native — it fails to load on Apple
# Silicon. Force a current JNA (Gradle resolves the higher version) so native pinning works there too.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
# Aeron: high-performance UDP/IPC messaging transport (Chunk 8). aeron-client + aeron-driver pull the
# real org.agrona:agrona artifact (deduped with engine-core's), so we avoid the unshaded aeron-all fat jar.
aeron-client = { module = "io.aeron:aeron-client", version.ref = "aeron" }
aeron-driver = { module = "io.aeron:aeron-driver", version.ref = "aeron" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.3" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
jmh = { id = "me.champeau.jmh", version = "0.7.2" }
