# Build performance toggles. None of these affect benchmark accuracy — JMH and the
# demos fork their own clean JVMs, isolated from the Gradle daemon.
org.gradle.caching=true
org.gradle.parallel=true

# Note on JDKs: the Gradle *wrapper* (./gradlew) launches on whatever `java` is first
# on your PATH. This project needs that to be Java 21. If you have a newer JDK as the
# default for a system-installed `gradle` (e.g. Homebrew's), prefer ./gradlew — it
# respects PATH. If ./gradlew ever picks the wrong JDK, set JAVA_HOME to your 21 JDK.
